---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: "default"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: &name "external-secrets"
          serviceAccountRef:
            name: *name
            namespace: *name
            audiences:
              - vault
