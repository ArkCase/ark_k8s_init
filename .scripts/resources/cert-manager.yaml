---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cluster-local-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arkcase-net
spec:
  isCA: true
  commonName: arkcase-net
  subject:
    organizations:
      - Armedia, LLC
  secretName: arkcase-net
  secretTemplate:
    labels:
      armedia-certificate/role: "ca"
      armedia-certificate/trust: "true"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cluster-local-root
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: arkcase-com
spec:
  isCA: true
  commonName: arkcase-com
  subject:
    organizations:
      - Armedia, LLC
  secretName: arkcase-com
  secretTemplate:
    labels:
      armedia-certificate/role: "ca"
      armedia-certificate/trust: "true"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cluster-local-root
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: armedia-net
spec:
  isCA: true
  commonName: armedia-net
  subject:
    organizations:
      - Armedia, LLC
  secretName: armedia-net
  secretTemplate:
    labels:
      armedia-certificate/role: "ca"
      armedia-certificate/trust: "true"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cluster-local-root
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: armedia-com
spec:
  isCA: true
  commonName: armedia-com
  subject:
    organizations:
      - Armedia, LLC
  secretName: armedia-com
  secretTemplate:
    labels:
      armedia-certificate/role: "ca"
      armedia-certificate/trust: "true"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cluster-local-root
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  annotations:
  name: &name cluster-local
spec:
  isCA: true
  commonName: *name
  subject:
    organizations:
      - Armedia, LLC
  secretName: *name
  secretTemplate:
    labels:
      cluster-local-certificate/role: "ca"
      cluster-local-certificate/trust: "true"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: cluster-local-root
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: &name arkcase-net
spec:
  ca:
    secretName: *name
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: &name arkcase-com
spec:
  ca:
    secretName: *name
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: &name armedia-net
spec:
  ca:
    secretName: *name
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: &name armedia-com
spec:
  ca:
    secretName: *name
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: &name cluster-local
spec:
  ca:
    secretName: *name
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: "ca-trusts"
spec:

  sources:
    - useDefaultCAs: true

    # This solves our problem of manually having to
    # add our certificates to the trust store
    - secret:
        key: "ca.crt"
        selector:
          matchLabels:
            armedia-certificate/role: "ca"
            armedia-certificate/trust: "true"

  target:
    configMap:
      key: "ca-trusts.pem"
    additionalFormats:
      jks:
        key: "cacerts"
      pkcs12:
        key: "cacerts.p12"

    #
    # Only add the "ca-trusts" configmap to the namespaces
    # that have this label. This allows us to avoid wanton
    # creation of potentially large configmap objects all
    # over the place, even when they're not needed
    #
    # Note that the bit after the "/" in the annotation
    # name is meant to indicate which of the trust bundles
    # we want to import into the namespace, so we can add
    # multiple different ones if we so choose (b/c they
    # each will use a different configmap name)
    #
    namespaceSelector:
      matchLabels:
        armedia-certificate-trusts/ca-trusts: "true"
